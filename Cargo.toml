[workspace]
resolver = "3"
members = ["crates/cam-geom", "crates/cam-io", "crates/cam-ops", "crates/cam-post", "crates/cam-sim", "app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
cam-geom = { path = "crates/cam-geom" }
cam-io = { path = "crates/cam-io" }
cam-ops = { path = "crates/cam-ops" }
cam-post = { path = "crates/cam-post" }
cam-sim = { path = "crates/cam-sim" }
cavalier_contours = "0.9"
dxf = "0.6"
stl_io = "0.11"
glam = { version = "0.34", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui-wgpu = "0.37"
rfd = "0.18"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
log = "0.4"
env_logger = "0.11"

[profile.dev.package."*"]
opt-level = 2

# symulacja musi być szybka także w trybie debug
[profile.dev.package.cam-sim]
opt-level = 3
