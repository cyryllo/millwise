<?xml version="1.0" encoding="UTF-8"?>
<!-- Millwise — ikona programu. Litera M jako rowek wyfrezowany w materiale,
     zielona linia = ścieżka narzędzia, czerwony okrąg = frez (widok z góry). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3756"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="groove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4b8ff2"/>
      <stop offset="1" stop-color="#2c63c9"/>
    </linearGradient>
    <radialGradient id="tool" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff8a74"/>
      <stop offset="1" stop-color="#d9412e"/>
    </radialGradient>
  </defs>

  <!-- tło -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="106.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- rowek w kształcie M: cień krawędzi, dno, odblask -->
  <path d="M138 378 V150 L256 298 L374 150 V378" fill="none" stroke="#0b1020" stroke-opacity="0.55"
        stroke-width="78" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 6)"/>
  <path d="M138 378 V150 L256 298 L374 150 V378" fill="none" stroke="url(#groove)"
        stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M138 378 V150 L256 298 L374 150 V378" fill="none" stroke="url(#groove)"
        stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ścieżka narzędzia -->
  <path d="M138 378 V150 L256 298 L374 150 V340" fill="none" stroke="#5be37f"
        stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="20 16"/>

  <!-- frez (widok z góry) na końcu ścieżki -->
  <circle cx="374" cy="378" r="44" fill="#0b1020" fill-opacity="0.45" transform="translate(0 6)"/>
  <circle cx="374" cy="378" r="42" fill="url(#tool)" stroke="#ffffff" stroke-width="9"/>
  <path d="M374 348 C 392 360, 392 372, 374 378 C 356 384, 356 396, 374 408" fill="none" stroke="#ffffff"
        stroke-opacity="0.85" stroke-width="7" stroke-linecap="round"/>
  <circle cx="374" cy="378" r="6" fill="#ffffff"/>
</svg>
